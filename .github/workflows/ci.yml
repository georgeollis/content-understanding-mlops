name: CI

# Runs scripts/ci-check.ps1 (schema validation, golden-set integrity, family-index freshness)
# on every push and pull request. This is the same command documented in README.md and
# docs/getting-started.md for local pre-commit use - CI just guarantees it actually ran.
#
# Does NOT call Azure / any live Content Understanding endpoint - see the separate
# compare-analyzers.ps1 workflow (or run it manually) for that.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  ci-check:
    # All scripts under scripts/ and schemas/ use Join-Path with separate arguments (never
    # literal backslash-joined strings), so they resolve correctly on any OS pwsh runs on.
    # Test on both Linux and Windows runners to guard against that regressing.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Golden-set *.pdf fixtures are stored via Git LFS (see .gitattributes). checkout@v4
          # does not fetch LFS content by default, which left CI with tiny LFS pointer stubs
          # instead of real PDF bytes and made ci-check.ps1's checksum validation fail.
          lfs: true

      - name: Run ci-check.ps1
        shell: pwsh
        run: ./scripts/ci-check.ps1

